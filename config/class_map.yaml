# Maps each detector's native class names onto the stage-1 taxonomy (v7 §34.1).
# A null target drops that class. With `ignore_unlisted: false`, a native class missing
# from the map is an error rather than silently mapped.
schema_version: 1
# `helmet` is evidence only: detected hard hats support the PPE head, they are never tracked.
taxonomy: [person, machinery, vehicle, helmet, suspended_load, fire, smoke]
maps:
  # Pretrained COCO weights: the Phase 2 baseline. COCO has no construction machinery.
  coco_pretrained:
    ignore_unlisted: true
    classes:
      person: person
      car: vehicle
      truck: vehicle
      bus: vehicle
  # Open-vocabulary YOLOE-26l with the construction prompts of tools/build_open_vocab.py.
  yoloe_construction:
    ignore_unlisted: false
    classes:
      person: person
      hard hat: helmet
      excavator: machinery
      # A tower crane's hazard is its suspended load, not its fixed mast; R4 models
      # proximity to moving plant on the ground, so masts are not tracked as machinery.
      tower crane: null
      mobile crane: machinery
      wheel loader: machinery
      bulldozer: machinery
      backhoe loader: machinery
      forklift: machinery
      road roller: machinery
      concrete pump truck: machinery
      concrete mixer truck: vehicle
      dump truck: vehicle
      truck: vehicle
      car: vehicle
      # v3 hazards: what hangs from a crane (R7) and fire or smoke (R8).
      crane hook: suspended_load
      suspended load: suspended_load
      # Candidate prompts for R7, tried on SynthSite's dev split only
      # (evaluation/synthsite_eval.py); unused unless a model was built with them.
      crane hook block: suspended_load
      load hanging from a crane: suspended_load
      steel beam lifted by a crane: suspended_load
      bundle of rebar lifted by a crane: suspended_load
      concrete bucket hanging from a crane: suspended_load
      # From tools/probe_load_prompts.py on the dev split (evaluation/r7_prompt_probe.json).
      steel beam: suspended_load
      crane lifting a load: suspended_load
      hoisted load: suspended_load
      fire: fire
      smoke: smoke
  # Frozen after profiling the Roboflow Construction Site Safety v27 export (Phase 3).
